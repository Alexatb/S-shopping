<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --text: var(--tg-theme-text-color, #1b1d21);
    --hint: var(--tg-theme-hint-color, #7b828c);
    --accent: var(--tg-theme-button-color, #1f7a5a);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--text) 12%, transparent);
    --radius: 14px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { padding-bottom: 96px; font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { padding: 20px 16px 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  header h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--hint); font-size: 0.92rem; }
  .addbtn { background: var(--accent); color: var(--accent-text); border-radius: 999px; padding: 9px 14px; font-weight: 700; white-space: nowrap; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px 16px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card { background: var(--bg2); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
  .thumb { aspect-ratio: 1; display: grid; place-items: center; font-size: 3rem; background: color-mix(in srgb, var(--accent) 14%, var(--bg2)); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .name { font-weight: 600; font-size: 0.95rem; overflow-wrap: anywhere; }
  .desc { color: var(--hint); font-size: 0.8rem; flex: 1; overflow-wrap: anywhere; }
  .price { font-weight: 700; margin-top: 4px; }
  .add { margin-top: 8px; background: var(--accent); color: var(--accent-text); border-radius: 10px; padding: 9px 0; font-weight: 600; width: 100%; }
  .del { margin-top: 6px; color: #d64545; font-size: 0.85rem; font-weight: 600; padding: 6px 0; width: 100%; }
  .qty { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; background: var(--bg); border-radius: 10px; }
  .qty button { width: 42px; height: 38px; font-size: 1.2rem; font-weight: 700; color: var(--accent); }
  .qty span { font-weight: 700; min-width: 24px; text-align: center; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
  .primary { width: 100%; background: var(--accent); color: var(--accent-text); border-radius: 12px; padding: 14px; font-weight: 700; display: flex; justify-content: space-between; }
  .primary.center { justify-content: center; }
  .primary:disabled { opacity: 0.5; cursor: default; }

  .view { padding: 0 16px 16px; }
  .view h2 { font-size: 1.2rem; margin: 20px 0 10px; }
  .back { color: var(--accent); padding: 16px 0 0; font-weight: 600; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row small { color: var(--hint); display: block; }
  .total { font-weight: 700; font-size: 1.1rem; border-bottom: 0; }
  label { display: block; font-size: 0.85rem; color: var(--hint); margin: 12px 0 4px; }
  input, textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg2); border: 1px solid transparent; border-radius: 10px; padding: 12px; }
  input.bad, textarea.bad { border-color: #d64545; }
  .err { color: #d64545; font-size: 0.82rem; margin-top: 4px; min-height: 1em; }
  .pay { background: var(--bg2); border-radius: var(--radius); padding: 4px 14px; }
  .pay .row:last-child { border-bottom: 0; }
  .copy { color: var(--accent); font-weight: 600; white-space: nowrap; }
  .steps { padding-left: 20px; }
  .steps li { margin: 6px 0; }
  .secondary { width: 100%; margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 13px; font-weight: 600; }
  .empty { text-align: center; color: var(--hint); padding: 48px 16px; }
  .owner { display: block; margin: 8px auto 0; color: var(--hint); font-size: 0.8rem; padding: 10px; }
  .panel { background: var(--bg2); border-radius: var(--radius); margin: 8px 16px 0; padding: 12px 14px; }
  .panel p { margin: 0 0 8px; font-size: 0.88rem; }
  .panel .pending { color: #b8731a; font-weight: 600; }
  .panel .secondary { margin-top: 8px; padding: 10px; background: var(--bg); }
  .picker { display: grid; place-items: center; text-align: center; aspect-ratio: 1; max-width: 260px; margin: 8px auto 0; border: 2px dashed var(--line); border-radius: var(--radius); overflow: hidden; color: var(--hint); cursor: pointer; background: var(--bg2); }
  .picker img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 0.88rem; opacity: 0; pointer-events: none; transition: opacity 0.2s; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   EDIT THIS PART ONCE: your shop details
   ============================================================ */
const CONFIG = {
  shopName: "My Shop",
  tagline: "Order here, pay by Telebirr or bank transfer.",
  sellerUsername: "Tokkiitti",   // without @
  currency: "ETB",
  payment: [
    { label: "Telebirr", account: "0940218953", holder: "Simera" },
    { label: "CBE", account: "1000XXXXXXXXX", holder: "Your Name" }
  ],
  // Owner mode is hidden from everyone except you.
  // 1) Put your Telegram numeric ID here (get it from @userinfobot), e.g. [123456789]
  ownerTelegramIds: [1193235776],
  // 2) Backup way in: tap the shop title 7 times, then enter this PIN. Change it!
  ownerPin: "4042",
  // Publishing: where your products.json lives on GitHub
  githubOwner: "alexatb",
  githubRepo: "S-shopping",
  githubBranch: "main",
  githubPath: "products.json",
  productsFile: "products.json"   // the file this page loads products from
};

/* ============================================================
   App
   ============================================================ */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

const $app = document.getElementById("app");
const $toast = document.getElementById("toast");

let published = [];      // what customers see (from products.json)
let ownerList = [];      // the owner's working copy
let ownerMode = false;
let pending = false;     // owner has changes not yet uploaded
let loading = true;
let loadError = "";
let cart = {};
let view = "shop";       // shop | cart | checkout | done | newproduct
let form = { name: "", phone: "", address: "", notes: "" };
let draft = { name: "", price: "", descr: "", image: "" };
let order = null;

function store(key, value) { try { localStorage.setItem(key, value); return true; } catch (e) { return false; } }
function recall(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
try { cart = JSON.parse(recall("cart") || "{}"); } catch (e) { cart = {}; }
try { ownerList = JSON.parse(recall("ownerList") || "[]"); } catch (e) { ownerList = []; }
const myTelegramId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
const canOwner = () => (myTelegramId !== null && CONFIG.ownerTelegramIds.includes(myTelegramId)) || recall("ownerUnlocked") === "1";
ownerMode = recall("ownerMode") === "1" && canOwner();
pending = recall("ownerPending") === "1";
let ghToken = recall("ghToken") || "";
const saveCart = () => store("cart", JSON.stringify(cart));

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const money = n => new Intl.NumberFormat("en-US").format(n) + " " + CONFIG.currency;
const list = () => ownerMode ? ownerList : published;
const byId = id => list().find(p => String(p.id) === String(id));
const lines = () => Object.keys(cart).filter(id => cart[id] > 0 && byId(id)).map(id => ({ p: byId(id), q: cart[id] }));
const count = () => lines().reduce((s, l) => s + l.q, 0);
const total = () => lines().reduce((s, l) => s + Number(l.p.price) * l.q, 0);

function toast(msg) {
  $toast.textContent = msg;
  $toast.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $toast.classList.remove("show"), 2400);
}
function haptic() { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light"); } catch (e) {} }

/* ---------- loading the published list ---------- */
async function loadPublished() {
  loading = true; loadError = ""; render();
  try {
    const res = await fetch(CONFIG.productsFile + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error("Bad file");
    published = data;
    if (ownerMode && !ownerList.length && !pending) { ownerList = clone(published); persistOwner(); }
  } catch (e) {
    loadError = "Could not load products. Check your connection and try again.";
  }
  loading = false; render();
}
const clone = x => JSON.parse(JSON.stringify(x));

function persistOwner() {
  const ok = store("ownerList", JSON.stringify(ownerList)) && store("ownerPending", pending ? "1" : "0");
  if (!ok) toast("Phone storage is full. Export your products file now.");
}

/* ---------- navigation ---------- */
function change(id, d) {
  cart[id] = Math.max(0, (cart[id] || 0) + d);
  if (!cart[id]) delete cart[id];
  saveCart(); haptic(); render();
}
function go(v) { view = v; render(); window.scrollTo(0, 0); }

/* ---------- views ---------- */
function ownerPanel() {
  if (!ownerMode) return "";
  const state = pending
    ? `<p class="pending">You have changes that customers can’t see yet. Tap Publish to save them to your shop.</p>`
    : `<p>Owner mode. Customers see the products from your uploaded file.</p>`;
  return `<div class="panel">${state}
    <button class="primary center" style="margin-top:8px" data-act="publish">${ghToken ? "Publish to my shop" : "Set up publishing"}</button>
    ${ghToken ? `<button class="secondary" data-act="removetoken">Remove saved token from this device</button>` : ""}
    <button class="secondary" data-act="download">Download products file</button>
    <button class="secondary" data-act="copyfile">Copy file text</button>
    <button class="secondary" data-act="resync">Discard my changes and reload published list</button></div>`;
}

function shopView() {
  const items = list();
  let body;
  if (loading && !items.length) body = `<div class="empty">Loading products…</div>`;
  else if (loadError && !items.length) body = `<div class="empty">${esc(loadError)}<br><br><button class="secondary" data-act="reload">Try again</button></div>`;
  else if (!items.length) body = `<div class="empty">No products yet.${ownerMode ? "<br>Tap “Add product” to create your first one." : ""}</div>`;
  else body = `<div class="grid">${items.map(cardHtml).join("")}</div>`;

  const owner = ownerMode
    ? `<button class="owner" data-act="ownerOff">Leave owner mode</button>`
    : (canOwner() ? `<button class="owner" data-act="ownerOn">Owner mode</button>` : "");
  const addBtn = ownerMode ? `<button class="addbtn" data-act="newproduct">+ Add product</button>` : "";
  const bar = count() ? `<div class="bar"><button class="primary" data-act="cart"><span>View cart (${count()})</span><span>${money(total())}</span></button></div>` : "";

  return `<header><div><h1 data-act="secret">${esc(CONFIG.shopName)}</h1><p>${esc(CONFIG.tagline)}</p></div>${addBtn}</header>${ownerPanel()}${body}${owner}${bar}`;
}

function cardHtml(p) {
  const q = cart[p.id] || 0;
  const thumb = p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">` : "🛍️";
  const action = q
    ? `<div class="qty"><button data-act="dec" data-id="${esc(p.id)}" aria-label="Remove one ${esc(p.name)}">−</button><span>${q}</span><button data-act="inc" data-id="${esc(p.id)}" aria-label="Add one ${esc(p.name)}">+</button></div>`
    : `<button class="add" data-act="inc" data-id="${esc(p.id)}">Add to cart</button>`;
  const del = ownerMode ? `<button class="del" data-act="delete" data-id="${esc(p.id)}">Delete product</button>` : "";
  return `<article class="card"><div class="thumb">${thumb}</div><div class="info"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.descr)}</div><div class="price">${money(p.price)}</div>${action}${del}</div></article>`;
}

function summaryRows() {
  return lines().map(l => `<div class="row"><div>${esc(l.p.name)}<small>${l.q} × ${money(l.p.price)}</small></div><div>${money(l.p.price * l.q)}</div></div>`).join("")
    + `<div class="row total"><div>Total</div><div>${money(total())}</div></div>`;
}

function cartView() {
  if (!count()) return `<div class="view"><button class="back" data-act="shop">‹ Back to shop</button><div class="empty">Your cart is empty.<br>Add something from the shop.</div></div>`;
  const items = lines().map(l => `<div class="row"><div>${esc(l.p.name)}<small>${money(l.p.price)} each</small></div><div class="qty" style="min-width:120px;margin:0;background:var(--bg2)"><button data-act="dec" data-id="${esc(l.p.id)}" aria-label="Remove one ${esc(l.p.name)}">−</button><span>${l.q}</span><button data-act="inc" data-id="${esc(l.p.id)}" aria-label="Add one ${esc(l.p.name)}">+</button></div></div>`).join("");
  return `<div class="view"><button class="back" data-act="shop">‹ Back to shop</button><h2>Your cart</h2>${items}<div class="row total"><div>Total</div><div>${money(total())}</div></div></div><div class="bar"><button class="primary" data-act="checkout"><span>Continue</span><span>${money(total())}</span></button></div>`;
}

function field(id, label, type, value, extra = "") {
  const input = type === "textarea"
    ? `<textarea id="f-${id}" rows="2" ${extra}>${esc(value)}</textarea>`
    : `<input id="f-${id}" type="${type}" value="${esc(value)}" ${extra}>`;
  return `<label for="f-${id}">${label}</label>${input}<div class="err" id="e-${id}"></div>`;
}

function checkoutView() {
  return `<div class="view"><button class="back" data-act="cart">‹ Back to cart</button><h2>Your details</h2>
    ${field("name", "Full name", "text", form.name, 'autocomplete="name"')}
    ${field("phone", "Phone number", "tel", form.phone, 'autocomplete="tel" inputmode="tel" placeholder="09…"')}
    ${field("address", "Delivery address", "textarea", form.address)}
    ${field("notes", "Notes (optional)", "textarea", form.notes)}
    <h2>Order</h2>${summaryRows()}</div>
    <div class="bar"><button class="primary" data-act="place"><span>Place order</span><span>${money(total())}</span></button></div>`;
}

function orderText() {
  const items = order.lines.map(l => `• ${l.name} × ${l.q} = ${money(l.price * l.q)}`).join("\n");
  return `New order ${order.id}\n\n${items}\n\nTotal: ${money(order.total)}\n\nName: ${order.name}\nPhone: ${order.phone}\nAddress: ${order.address}` + (order.notes ? `\nNotes: ${order.notes}` : "") + `\n\nI have paid. Receipt attached.`;
}

function doneView() {
  const pay = CONFIG.payment.map(m => `<div class="row"><div>${esc(m.label)}<small>${esc(m.holder)}</small><strong>${esc(m.account)}</strong></div><button class="copy" data-act="copy" data-text="${esc(m.account)}">Copy</button></div>`).join("");
  return `<div class="view"><h2>Order ${esc(order.id)} created</h2>
    <p>Pay <strong>${money(order.total)}</strong> to one of these accounts:</p>
    <div class="pay">${pay}</div>
    <h2>Next steps</h2>
    <ol class="steps"><li>Send the exact amount and keep the receipt.</li><li>Tap “Send order and receipt” to open a chat with the seller.</li><li>Attach your receipt screenshot and send. We confirm your order after checking the payment.</li></ol>
    <button class="primary center" style="margin-top:14px" data-act="send">Send order and receipt</button>
    <button class="secondary" data-act="copyorder">Copy order text</button>
    <button class="secondary" data-act="new">Start a new order</button></div>`;
}

function newProductView() {
  const pic = draft.image ? `<img src="${esc(draft.image)}" alt="Product photo preview">` : `<div>Tap to add a photo</div>`;
  return `<div class="view"><button class="back" data-act="shop">‹ Back to shop</button><h2>Add product</h2>
    <label for="f-file">Photo</label>
    <label class="picker" for="f-file" style="margin-top:0">${pic}</label>
    <input id="f-file" type="file" accept="image/*" style="display:none">
    <div class="err" id="e-image"></div>
    ${field("pname", "Product name", "text", draft.name, 'maxlength="80"')}
    ${field("pprice", "Price (" + esc(CONFIG.currency) + ")", "number", draft.price, 'inputmode="decimal" min="0" step="any"')}
    ${field("pdesc", "Short description (optional)", "textarea", draft.descr, 'maxlength="140"')}
  </div>
  <div class="bar"><button class="primary center" data-act="post">Add to my list</button></div>`;
}

/* ---------- render ---------- */
function render() {
  const views = { shop: shopView, cart: cartView, checkout: checkoutView, done: doneView, newproduct: newProductView, pin: pinView, token: tokenView };
  $app.innerHTML = views[view]();
  if (tg) {
    if (view === "shop") tg.BackButton.hide(); else if (view !== "done") tg.BackButton.show();
  }
}
if (tg) tg.BackButton.onClick(() => go(view === "checkout" ? "cart" : "shop"));

/* ---------- checkout ---------- */
function readForm() {
  ["name", "phone", "address", "notes"].forEach(k => { const el = document.getElementById("f-" + k); if (el) form[k] = el.value.trim(); });
}
function validate() {
  readForm();
  const errs = {};
  if (form.name.length < 2) errs.name = "Enter your full name.";
  if (!/^(\+?251|0)?[79]\d{8}$/.test(form.phone.replace(/[\s-]/g, ""))) errs.phone = "Enter a valid phone number, for example 0911223344.";
  if (form.address.length < 3) errs.address = "Enter your delivery address.";
  ["name", "phone", "address"].forEach(k => {
    document.getElementById("e-" + k).textContent = errs[k] || "";
    document.getElementById("f-" + k).classList.toggle("bad", !!errs[k]);
  });
  return Object.keys(errs).length === 0;
}
function placeOrder() {
  if (!validate()) { toast("Check the highlighted fields"); return; }
  const id = "ORD-" + Date.now().toString(36).toUpperCase().slice(-6);
  order = {
    id, total: total(), name: form.name, phone: form.phone, address: form.address, notes: form.notes,
    lines: lines().map(l => ({ name: l.p.name, price: Number(l.p.price), q: l.q }))
  };
  cart = {}; saveCart();
  go("done");
}

/* ---------- hidden owner entry ---------- */
let taps = 0, tapTimer;
function secretTap() {
  if (ownerMode || canOwner()) return;
  taps++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { taps = 0; }, 3000);
  if (taps >= 7) { taps = 0; go("pin"); }
}
function pinView() {
  return `<div class="view"><button class="back" data-act="shop">‹ Back to shop</button><h2>Enter PIN</h2>
    <label for="f-pin">PIN</label><input id="f-pin" type="password" autocomplete="off">
    <div class="err" id="e-pin"></div>
    <button class="primary center" style="margin-top:8px" data-act="unlock">Continue</button></div>`;
}
function unlock() {
  const pin = document.getElementById("f-pin").value;
  if (!CONFIG.ownerPin || pin !== CONFIG.ownerPin) {
    document.getElementById("e-pin").textContent = "Wrong PIN.";
    return;
  }
  store("ownerUnlocked", "1");
  setOwner(true);
  go("shop");
}

/* ---------- owner tools ---------- */
function setOwner(on) {
  if (on && !canOwner()) return;
  ownerMode = on;
  store("ownerMode", on ? "1" : "0");
  if (on && !ownerList.length && !pending) { ownerList = clone(published); persistOwner(); }
  render();
}

function readDraft() {
  const g = id => { const el = document.getElementById("f-" + id); return el ? el.value : ""; };
  draft.name = g("pname").trim(); draft.price = g("pprice").trim(); draft.descr = g("pdesc").trim();
}

function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read the photo."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("This file is not a valid image."));
      img.onload = () => {
        const max = 640;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.7));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function addProduct() {
  readDraft();
  const errs = {};
  if (!draft.image) errs.image = "Add a photo.";
  if (draft.name.length < 2) errs.pname = "Enter the product name.";
  const price = Number(draft.price);
  if (!draft.price || !isFinite(price) || price < 0) errs.pprice = "Enter a valid price.";
  ["image", "pname", "pprice"].forEach(k => {
    const e = document.getElementById("e-" + k);
    if (e) e.textContent = errs[k] || "";
  });
  if (Object.keys(errs).length) { toast("Check the highlighted fields"); return; }

  ownerList.unshift({ id: "p" + Date.now().toString(36), name: draft.name, price, descr: draft.descr, image: draft.image });
  pending = true; persistOwner();
  draft = { name: "", price: "", descr: "", image: "" };
  go("shop");
  toast("Added. Tap Publish to show it to customers.");
}

function deleteProduct(id) {
  const p = byId(id);
  if (!p || !confirm("Delete “" + p.name + "”?")) return;
  ownerList = ownerList.filter(x => String(x.id) !== String(id));
  delete cart[id]; saveCart();
  pending = true; persistOwner(); render();
}

const fileText = () => JSON.stringify(ownerList, null, 1);

function downloadFile() {
  const url = URL.createObjectURL(new Blob([fileText()], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url; a.download = "products.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("If nothing downloaded, use “Copy file text” instead.");
}

async function resync() {
  if (pending && !confirm("This removes products you added but have not uploaded yet. Continue?")) return;
  pending = false;
  await loadPublished();
  ownerList = clone(published);
  persistOwner(); render();
  toast("Reloaded from the published list");
}

/* ---------- publishing to GitHub ---------- */
function tokenView() {
  return `<div class="view"><button class="back" data-act="shop">‹ Back to shop</button><h2>Publishing token</h2>
    <p style="color:var(--hint);font-size:0.9rem">Paste your GitHub token once. It stays on this device only.</p>
    <label for="f-token">GitHub token</label><input id="f-token" type="password" autocomplete="off">
    <div class="err" id="e-token"></div>
    <button class="primary center" style="margin-top:8px" data-act="savetoken">Save token</button></div>`;
}
function saveToken() {
  const t = document.getElementById("f-token").value.trim();
  if (t.length < 20) { document.getElementById("e-token").textContent = "Paste the full token."; return; }
  ghToken = t; store("ghToken", t);
  go("shop"); toast("Token saved. Tap Publish.");
}
function removeToken() {
  ghToken = "";
  try { localStorage.removeItem("ghToken"); } catch (e) {}
  render(); toast("Token removed from this device");
}

const ghUrl = () => "https://api.github.com/repos/" + encodeURIComponent(CONFIG.githubOwner) + "/" + encodeURIComponent(CONFIG.githubRepo) + "/contents/" + CONFIG.githubPath.split("/").map(encodeURIComponent).join("/");
const ghHeaders = () => ({ Authorization: "Bearer " + ghToken, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" });
function toBase64(text) {
  const bytes = new TextEncoder().encode(text);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

let publishing = false;
async function publish() {
  if (publishing) return;
  if (!ghToken) { go("token"); return; }
  if (!CONFIG.githubOwner || CONFIG.githubOwner.indexOf("YOUR-") === 0 || CONFIG.githubRepo.indexOf("YOUR-") === 0) {
    toast("Set githubOwner and githubRepo in the file first"); return;
  }
  publishing = true; toast("Publishing…");
  try {
    let sha;
    const g = await fetch(ghUrl() + "?ref=" + encodeURIComponent(CONFIG.githubBranch), { headers: ghHeaders(), cache: "no-store" });
    if (g.ok) sha = (await g.json()).sha;
    else if (g.status !== 404) throw { status: g.status };
    const body = { message: "Update products from shop", content: toBase64(fileText()), branch: CONFIG.githubBranch };
    if (sha) body.sha = sha;
    const p = await fetch(ghUrl(), { method: "PUT", headers: { ...ghHeaders(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!p.ok) throw { status: p.status };
    published = clone(ownerList); pending = false; persistOwner(); render();
    toast("Published. Customers see it in 1–2 minutes.");
  } catch (e) {
    const s = e && e.status;
    if (s === 401) toast("GitHub does not accept the token. Set it up again.");
    else if (s === 403 || s === 404) toast("The token cannot write to this repository. Check its permissions and the settings in the file.");
    else if (s === 409 || s === 422) toast("The file changed on GitHub. Reload the published list and try again.");
    else toast("Could not publish. Check your connection.");
  }
  publishing = false;
}

/* ---------- helpers ---------- */
function copyText(text, okMsg) {
  const done = () => toast(okMsg);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const t = document.createElement("textarea");
  t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
  document.body.appendChild(t); t.select();
  try { document.execCommand("copy"); done(); } catch (e) { toast("Could not copy"); }
  document.body.removeChild(t);
}
function sendToSeller() {
  const url = "https://t.me/" + encodeURIComponent(CONFIG.sellerUsername) + "?text=" + encodeURIComponent(orderText());
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
}

/* ---------- events ---------- */
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === "inc") change(id, 1);
  else if (act === "dec") change(id, -1);
  else if (act === "cart") { if (view === "checkout") readForm(); go("cart"); }
  else if (act === "shop") { if (view === "newproduct") readDraft(); go("shop"); }
  else if (act === "checkout") go("checkout");
  else if (act === "place") placeOrder();
  else if (act === "copy") copyText(b.dataset.text, "Account number copied");
  else if (act === "copyorder") copyText(orderText(), "Order text copied");
  else if (act === "send") sendToSeller();
  else if (act === "new") go("shop");
  else if (act === "reload") loadPublished();
  else if (act === "publish") publish();
  else if (act === "savetoken") saveToken();
  else if (act === "removetoken") removeToken();
  else if (act === "secret") secretTap();
  else if (act === "unlock") unlock();
  else if (act === "ownerOn") setOwner(true);
  else if (act === "ownerOff") setOwner(false);
  else if (act === "newproduct") go("newproduct");
  else if (act === "post") addProduct();
  else if (act === "delete") deleteProduct(id);
  else if (act === "download") downloadFile();
  else if (act === "copyfile") copyText(fileText(), "File text copied. Paste it into products.json");
  else if (act === "resync") resync();
});

$app.addEventListener("change", async e => {
  if (e.target.id !== "f-file" || !e.target.files[0]) return;
  readDraft();
  try {
    draft.image = await resizeImage(e.target.files[0]);
    render();
  } catch (err) {
    toast(err.message);
  }
});

render();
loadPublished();
</script>
</body>
</html>
